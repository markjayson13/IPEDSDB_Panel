name: Bug report
description: A defect in the code, tests, docs site, or a command that fails.
title: "[bug] "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting a defect. Questions about how to use the panel belong in Q&A discussions, and a paper or class that uses the panel belongs in Show and tell.
  - type: dropdown
    id: horizon
    attributes:
      label: Horizon
      description: The bug label is applied with this form. Choosing Roadmap also adds the roadmap label.
      options:
        - Defect
        - Roadmap
    validations:
      required: true
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: What you expected
    validations:
      required: true
  - type: input
    id: command
    attributes:
      label: Command, file, or URL
    validations:
      required: false
  - type: input
    id: version
    attributes:
      label: Commit or release
      placeholder: ipedsdb-panel-2004-2023-access-final-v1
    validations:
      required: false
