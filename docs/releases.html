<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta http-equiv="refresh" content="0; url=./">
  <title>IPEDS Panel Codebook</title>
  <link rel="stylesheet" href="./assets/codebook.css">
</head>
<body>
  <main class="redirect-card">
    <p class="eyebrow">IPEDSDB Panel</p>
    <h1>The codebook is now the homepage.</h1>
    <p>Explore the published panel's definitions, year-specific category meanings, source records, and Stata mappings in one place.</p>
    <a class="button primary" href="./">Open the interactive codebook</a>
    <p><a href="./codebook/ipeds-panel-codebook.pdf" download>Download the full PDF codebook</a></p>
  </main>
  <script>
    const parameters = new URLSearchParams(location.hash.slice(1));
    const variable = parameters.get('variable');
    const target = new URL('./', location.href);
    if (variable) target.hash = new URLSearchParams({ variable }).toString();
    location.replace(target.href);
  </script>
</body>
</html>
